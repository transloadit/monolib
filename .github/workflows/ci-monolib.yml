name: Monolib CI

on:
  push:
    branches:
      - main
      - 'changeset-release/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-major }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-major: 22
            node-version: '^22.23.4'
          - node-major: 24
            node-version: '^24.22.1'
          - node-major: 26
            # Pin the validated tooling release while older majors retain compatibility coverage.
            node-version: '26.12.1'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install Corepack
        if: matrix.node-major == 26
        run: npm install --global corepack@0.36.0

      - name: 🏗 Setup Caching
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-node-${{ matrix.node-major }}-${{ hashFiles('**/yarn.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-major }}-

      - run: corepack yarn config set enableHardenedMode false
      - run: corepack yarn install --immutable

      - run: corepack yarn check
